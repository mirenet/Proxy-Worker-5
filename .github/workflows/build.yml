name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        accept-android-sdk-licenses: true
        packages: platforms;android-34 build-tools;34.0.0 platform-tools

    - name: Download and Setup Gradle 8.5
      run: |
        wget https://services.gradle.org/distributions/gradle-8.5-bin.zip -O gradle.zip
        unzip -q gradle.zip
        gradle-8.5/bin/gradle wrapper --gradle-version 8.5 --distribution-type bin
        chmod +x gradlew
        rm -rf gradle.zip

    - name: Build Release APK
      run: ./gradlew clean assembleRelease --stacktrace
      
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk
